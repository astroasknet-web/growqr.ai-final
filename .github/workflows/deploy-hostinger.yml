# Builds the portal on GitHub (so the small Hostinger server never has to run a heavy `next build`) and publishes a ready-to-run server to
# the `deploy` branch. Hostinger pulls that branch and runs `node server.js`. See migration/HOSTINGER.md.
name: Build portal for Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Unit tests (no database)
        run: npx vitest run
      - name: Build (standalone server)
        env:
          BUILD_STANDALONE: "1"
          # NEXT_PUBLIC_* values are baked into the browser code at build time, so they are supplied here, not on Hostinger.
          # Repository secret BUILD_ENV holds them as plain `NAME=value` lines (see migration/env.example).
          BUILD_ENV: ${{ secrets.BUILD_ENV }}
        run: |
          printf '%s\n' "$BUILD_ENV" > .env.production
          npx next build
      - name: Assemble the deploy folder
        run: |
          rm -rf dist && cp -r .next/standalone dist
          mkdir -p dist/.next && cp -r .next/static dist/.next/static
          cp -r public dist/public
          node scripts/prune-public.mjs dist/public
          cp -r supabase dist/supabase
          # Never ship an env file: the server reads its settings from the host (or from a .env.production the owner creates there).
          rm -f dist/.env dist/.env.* 
          echo "${GITHUB_SHA}" > dist/BUILD_SHA
      - name: Publish to the deploy branch
        run: |
          cd dist
          git init -q -b deploy
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -q -m "Build of ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" deploy
